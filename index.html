<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Testament Baptist Academy</title>
    <meta name="description" content="School management dashboard for New Testament Baptist Academy — Creche to Primary. Manage students, classes, attendance, announcements, and school content." />
    <meta property="og:title" content="New Testament Baptist Academy" />
    <meta property="og:description" content="School management dashboard for New Testament Baptist Academy — Creche to Primary. Manage students, classes, attendance, announcements, and school content." />
    <meta name="theme-color" content="#073a78" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23073a78'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kalam:wght@700&display=swap" rel="stylesheet" />

    <script>
      // Early runtime error catcher to prevent white/blank screen in browser
      window.addEventListener('error', function(event) {
        console.error('Captured window error:', event.error || event.message);
        var root = document.getElementById('root');
        var fallback = document.getElementById('app-loading-fallback');
        if (root && (!root.children || root.children.length === 0 || fallback)) {
          root.innerHTML = '<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f8fd; font-family: Inter, system-ui, sans-serif; padding: 20px;">' +
            '<div style="max-width: 580px; width: 100%; background: #ffffff; border-radius: 16px; padding: 32px; box-shadow: 0 12px 36px rgba(0,0,0,0.1); border: 1px solid #fee2e2;">' +
            '<div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px; color: #dc2626;">' +
            '<span style="font-size: 26px;">⚠️</span>' +
            '<h2 style="margin: 0; font-size: 19px; font-weight: 800;">Notice: Application Startup Error</h2>' +
            '</div>' +
            '<p style="font-size: 13.5px; color: #475569; line-height: 1.6; margin: 0 0 16px;">' +
            (event.message || 'An unexpected error occurred while loading application modules.') +
            '</p>' +
            '<div style="display: flex; gap: 10px; flex-wrap: wrap;">' +
            '<button onclick="try { localStorage.clear(); sessionStorage.clear(); } catch(e){} window.location.reload();" style="padding: 10px 18px; background: #073a78; color: #fff; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px;">Reset Data & Reload</button>' +
            '<button onclick="window.location.reload();" style="padding: 10px 18px; background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px;">Retry</button>' +
            '</div>' +
            '</div>' +
            '</div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Branded instant loading state so user never sees a blank white screen -->
      <div id="app-loading-fallback" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #073a78; color: #ffffff; font-family: Inter, system-ui, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; font-size: 28px;">
          🎓
        </div>
        <h1 style="font-size: 22px; margin: 0 0 8px; font-weight: 800; letter-spacing: -0.3px;">New Testament Baptist Academy</h1>
        <p style="font-size: 13px; color: #c8e1ff; margin: 0 0 24px; max-width: 440px;">School Management Portal — Initializing school records &amp; modules...</p>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.22); border-top-color: #ffdd57; border-radius: 50%; animation: ntba-spin 0.8s linear infinite;"></div>
        <style>@keyframes ntba-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
